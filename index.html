<style>
/* Layout concept: a plain, dense work-app shell (blue header, white cards on a grey ground) mirroring the SRS wireframes, so reviewers can compare screen by screen. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#e5e7eb; --border:#9ca3af; --input-border:#4b5563;
  --text:#1f2937; --muted:#4b5563; --hdr:#1e3a8a; --hdr-text:#ffffff;

  --pen-bg:#e0e7ff; --pen-fg:#3730a3; --neu-bg:#f3f4f6; --neu-fg:#374151;
  --warn-bg:#fffbeb; --warn-fg:#78350f; --err-bg:#fef2f2; --err-fg:#7f1d1d; --info-bg:#eff6ff; --info-fg:#1e3a8a; --ok-bg:#f0fdf4; --ok-fg:#14532d;
  --sel:#eff6ff; --bar:#1d4ed8; --bar2:#4b5563;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c31; --surface2:#1d2a47; --border:#3d4c6d; --input-border:#8fa0c0;
  --text:#e8edf7; --muted:#b4c0d6; --hdr:#0a1a45; --hdr-text:#ffffff;
  --primary:#2f66e0; --on-primary:#ffffff; --link:#8db4ff; --focus:#9dbcff;
  --new-bg:#123524; --new-fg:#86efac; --chg-bg:#3a2a0b; --chg-fg:#fcd34d; --can-bg:#3f1318; --can-fg:#fca5a5;
  --pen-bg:#26235a; --pen-fg:#c7d2fe; --neu-bg:#1d2a47; --neu-fg:#cbd5e1;
  --warn-bg:#33250a; --warn-fg:#fcd34d; --err-bg:#3b1219; --err-fg:#fecaca; --info-bg:#10244f; --info-fg:#bfd4ff; --ok-bg:#0f2e1d; --ok-fg:#bbf7d0;
  --sel:#1a2b57; --bar:#6ea0ff; --bar2:#94a3b8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c31; --surface2:#1d2a47; --border:#3d4c6d; --input-border:#8fa0c0;
  --text:#e8edf7; --muted:#b4c0d6; --hdr:#0a1a45; --hdr-text:#ffffff;
  --primary:#2f66e0; --on-primary:#ffffff; --link:#8db4ff; --focus:#9dbcff;
  --new-bg:#123524; --new-fg:#86efac; --chg-bg:#3a2a0b; --chg-fg:#fcd34d; --can-bg:#3f1318; --can-fg:#fca5a5;
  --pen-bg:#26235a; --pen-fg:#c7d2fe; --neu-bg:#1d2a47; --neu-fg:#cbd5e1;
  --warn-bg:#33250a; --warn-fg:#fcd34d; --err-bg:#3b1219; --err-fg:#fecaca; --info-bg:#10244f; --info-fg:#bfd4ff; --ok-bg:#0f2e1d; --ok-fg:#bbf7d0;
  --sel:#1a2b57; --bar:#6ea0ff; --bar2:#94a3b8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--link);padding:8px 12px;border:2px solid var(--link);border-radius:4px;z-index:50;font-weight:600}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hdr :focus-visible{outline-color:#ffffff}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--hdr);color:var(--hdr-text)}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding-block:10px}
.logo{font-weight:700;font-size:18px;letter-spacing:.2px}
.proto-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid #fff;border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:2px}
nav ul{display:flex;flex-wrap:wrap;gap:4px 8px;list-style:none;margin:0;padding:0}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--hdr-text);font:inherit;font-size:14px;padding:6px 4px;cursor:pointer}
nav button[aria-current="page"]{border-bottom-color:#fff;font-weight:700}
.user{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13.5px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border:2px solid var(--primary);color:var(--link);background:var(--surface);padding:7px 14px;border-radius:5px;cursor:pointer}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.s{font-size:13px;padding:4px 10px}
.btn[aria-disabled="true"]{background:var(--surface2);border-color:var(--input-border);color:var(--muted);cursor:not-allowed}
.hdr .btn{background:transparent;color:var(--hdr-text);border-color:#fff;padding:4px 10px;font-size:13px}
main{display:block;padding-block:18px 40px}
main:focus,h1:focus{outline:none}
h1{font-size:22px;margin:0 0 12px;line-height:1.25;text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
.card.flush>h2{padding:12px 16px 0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--muted)}
.sm{font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.cols .card{margin-bottom:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;font-size:14px;vertical-align:middle}
th{background:var(--surface2);font-size:13px}
td.c,th.c{text-align:center}
.card.flush table{border-left:0;border-right:0}
.bd{display:inline-block;padding:1px 8px;border-radius:11px;font-size:12.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.bd.new{background:var(--new-bg);color:var(--new-fg)}.bd.chg{background:var(--chg-bg);color:var(--chg-fg)}.bd.can{background:var(--can-bg);color:var(--can-fg)}
.bd.pen{background:var(--pen-bg);color:var(--pen-fg)}.bd.neu{background:var(--neu-bg);color:var(--neu-fg)}.bd.ack{background:var(--new-bg);color:var(--new-fg)}
.alert{border:1px solid currentColor;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-size:14px}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg)}.alert.err{background:var(--err-bg);color:var(--err-fg)}
.alert.info{background:var(--info-bg);color:var(--info-fg)}.alert.ok{background:var(--ok-bg);color:var(--ok-fg)}
.alert .row{justify-content:space-between}
label,.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:2px solid var(--input-border);border-radius:4px;padding:8px 10px}
textarea{min-height:76px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err-fg)}
.fld{margin-bottom:14px}
.err-t{color:var(--err-fg);font-size:13.5px;font-weight:600;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--primary);flex:none}
.cellbtn{font:inherit;font-weight:700;width:100%;background:var(--surface);color:var(--text);border:2px solid transparent;padding:6px 4px;cursor:pointer;border-radius:4px}
.cellbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--primary)}
td.g{padding:2px;text-align:center}
td.g select{font-size:13px;padding:7px 2px}
td.g input[type=number]{font-size:14px}
.item{display:block;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.item[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.tile .n{font-size:28px;font-weight:700;line-height:1.2}
.barrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.barrow .d{width:42px}
.bar{height:12px;border-radius:2px;background:var(--bar);display:inline-block}
.bar.g{background:var(--bar2)}
.login{max-width:430px;margin:8px auto 0}
.demo{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
ol.walk{margin:6px 0 0;padding-left:20px}ol.walk li{margin:3px 0}
.legend{font-size:13px;color:var(--muted);margin:8px 2px 14px}
s{opacity:.85}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background-color .12s}}
@media (max-width:560px){.user{margin-left:0}h1{font-size:20px}}
</style>

<script>
(function(){
'use strict';
document.documentElement.lang='en';
/* ---------------------------------------------------------------- data */
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DATES=['26 Oct','27 Oct','28 Oct','29 Oct','30 Oct','31 Oct','1 Nov'];
var SH={M:{n:'Morning',t:'06:00–14:00'},A:{n:'Afternoon',t:'14:00–22:00'},N:{n:'Night',t:'22:00–06:00'}};
var USERS={
  'an.nguyen@factory.example':{name:'Nguyen Van An',role:'Employee'},
  'quan.tran@factory.example':{name:'Tran Minh Quan',role:'Manager'},
  'bao.ly@factory.example':{name:'Ly Quoc Bao',role:'Boss'}};
var PASSWORD='demo1234';
var NAV={Employee:[['schedule','My Schedule'],['availability','Availability & Overtime'],['report','Report Absence']],
         Manager:[['accounts','Employee Accounts'],['staffing','Staffing & Overtime'],['scheduling','Weekly Scheduling'],['team','Team Schedule'],['coverage','Absence & Coverage']],
         Boss:[['overview','Staffing Overview']]};
var HOME={Employee:'schedule',Manager:'scheduling',Boss:'overview'};
var WEEKS=['19 Oct – 25 Oct 2026','26 Oct – 1 Nov 2026','2 Nov – 8 Nov 2026'];
var REQ={M:[4,4,4,4,4,3,3],A:[3,3,3,3,3,2,2],N:[2,2,2,2,2,1,1]};
var NIGHTS={'Nguyen Van An':2,'Tran Thi Binh':4,'Le Van Cuong':1,'Pham Thi Dung':3,'Hoang Van Em':6,'Vo Thi Phuong':3,'Dang Van Giang':2,'Do Van Hieu':2,'Bui Thi Hoa':2,'Truong Van Khoa':3,'Ngo Thi Lan':2,'Dinh Van Minh':5};

function row(c,ch,prev,pos){return {c:c,ch:ch||null,prev:prev||'',pos:pos||'Machine Operator'};}
var S={
  user:null, screen:'login', flash:null, failed:0,
  week:1, open:{}, ver:3, pub:'25 Oct 2026, 16:30', anAck:'pending', anAckAt:'',
  lastAck:'version 2 · 18 Oct 2026, 17:10', sup:0, anNote:'', simFail:false, simStale:false,
  avLocked:false, avWork:null, stTarget:'default', stWork:null, stErr:null, stDiscard:false,
  crit:{M:false,A:false,N:true}, closed:{M:false,A:false,N:false},
  an:[row('M'),row('M','new','Not assigned'),row('A','chg','Morning 06:00–14:00'),row('-'),row('M'),row('M','can','Morning 06:00–14:00'),row('-')],
  team:[
    {n:'Nguyen Van An',codes:null,ack:'pending'},
    {n:'Tran Thi Binh',codes:'MMMMM--',ack:'25 Oct 17:02'},
    {n:'Le Van Cuong',codes:'MMMM-M-',ack:'25 Oct 17:20'},
    {n:'Pham Thi Dung',codes:'AAAAA--',ack:'25 Oct 18:05'},
    {n:'Hoang Van Em',codes:'NNNNN--',ack:'pending'},
    {n:'Vo Thi Phuong',codes:'-MMMMM-',ack:'25 Oct 17:40'},
    {n:'Dang Van Giang',codes:'AA-AAA-',ack:'pending'},
    {n:'Do Van Hieu',codes:'A--A-AA',ack:'notreq'},
    {n:'Bui Thi Hoa',codes:'MMMMM--',ack:'25 Oct 17:05'},
    {n:'Truong Van Khoa',codes:'-AAAAA-',ack:'notreq'},
    {n:'Ngo Thi Lan',codes:'AAA-AA-',ack:'25 Oct 18:20'},
    {n:'Dinh Van Minh',codes:'NN-NNN-',ack:'25 Oct 17:31'}],
  pendingOnly:false,
  items:[
    {id:1,name:'Le Van Cuong',d:3,c:'M',pos:'Machine Operator',kind:'Absence reported 29 Oct 05:50',reason:'Illness',resolved:false,offer:{to:'Nguyen Van An',st:'pending',at:'29 Oct 06:15',ot:true}},
    {id:2,name:'Pham Thi Dung',d:2,c:'A',pos:'Packer',kind:'No-show recorded 28 Oct 14:20',reason:'',resolved:false,offer:null},
    {id:3,name:'Vo Thi Phuong',d:1,c:'M',pos:'Packer',kind:'Absence reported 26 Oct 20:05',reason:'Family matter',resolved:true,offer:{to:'Do Van Hieu',st:'accepted',at:'26 Oct 21:10'}},
    {id:4,name:'Dang Van Giang',d:1,c:'A',pos:'Machine Operator',kind:'Absence reported 27 Oct 11:30',reason:'Transport problem',resolved:false,offer:{to:'Nguyen Van An',st:'expired',at:'27 Oct 11:40'}}],
  nextId:5, selItem:1, noShowOpen:false,
  ot:[
    {id:1,d:5,from:'14:00',to:'18:00',loc:'Packing area B',duties:'Pack and label outgoing orders',note:'Compensation follows company overtime policy (informational note only).',closed:false,published:false,
     su:[{n:'Do Van Hieu',st:'pending',elig:'Eligible'},{n:'Bui Thi Hoa',st:'pending',elig:'Not eligible: rest-time rule'}]},
    {id:2,d:6,from:'06:00',to:'10:00',loc:'Line 2',duties:'Machine set-up and quality checks',note:'Compensation follows company overtime policy (informational note only).',closed:false,published:false,su:[]}],
  otNext:3, otConsent:0, otErr:'', otPostErr:null,
  acc:[], accMode:'list', accEdit:'', accErr:null, accConfirm:null,
  reports:[{shift:'Tue 20 Oct · Afternoon 14:00–22:00',at:'19 Oct 20:10',st:'Resolved – covered'}],
  draft:null, sel:{s:'N',d:3}
};
var BASE_UNCOVERED=[{d:3,c:'N',pos:'QC Inspector'}];

/* ---------------------------------------------------------------- helpers */
var app=document.getElementById('app'), live=document.getElementById('live');
function announce(m){live.textContent='';setTimeout(function(){live.textContent=m;},30);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function flash(t,m){S.flash={t:t,m:m};announce(m);}
function bd(cls,txt){return '<span class="bd '+cls+'">'+txt+'</span>';}
function chBadge(ch){return ch==='new'?bd('new','+ NEW'):ch==='chg'?bd('chg','✎ CHANGED'):ch==='can'?bd('can','× CANCELLED'):'—';}
function lab(c){return SH[c].n+' '+SH[c].t;}
function dayLabel(d){return DAYS[d]+' '+DATES[d];}
function status(it){
  if(it.resolved) return ['Resolved','ack'];
  if(isEnded(it)) return ['Shift ended','neu'];
  if(it.offer&&it.offer.st==='pending') return ['Offer pending','pen'];
  if(it.offer&&it.offer.st==='accepted') return ['Accepted – awaiting confirmation','chg'];
  return ['Unresolved','can'];
}
function anCodes(){return S.an.map(function(r){return r.ch==='can'?'-':r.c;});}
function codesOf(t){
  var codes=(t.n==='Nguyen Van An')?anCodes():t.codes.split('');
  codes=codes.slice();
  S.items.forEach(function(it){
    if(it.name===t.n&&it.d!==undefined){ if(it.resolved) codes[it.d]='-'; else codes[it.d]='Abs'; }
    if(it.resolved&&it.offer&&it.offer.to===t.n&&it.offer.st==='accepted') codes[it.d]=it.c;
  });
  return codes;
}
function hoursOf(t){return codesOf(t).filter(function(c){return c==='M'||c==='A'||c==='N'||c==='Abs';}).length*8;}
function anHours(){return S.an.filter(function(r){return r.c!=='-'&&r.ch!=='can';}).length*8;}
function uncovered(){
  var list=BASE_UNCOVERED.map(function(u){return {d:u.d,c:u.c,pos:u.pos,src:'Published schedule'};});
  S.items.forEach(function(it){if(!it.resolved&&!isEnded(it))list.push({d:it.d,c:it.c,pos:it.pos,src:it.name+' ('+(it.kind.indexOf('No-show')===0?'no-show':'absence')+')'});});
  return list;
}
function current(){return S.items.filter(function(i){return i.id===S.selItem;})[0]||null;}
function nowStr(){return '29 Oct 06:30';}
function isEnded(it){return it.d<3;}
function inProg(it){return it.d===3&&it.c==='M';}
var CONTR={'Nguyen Van An':32,'Do Van Hieu':40,'Vo Thi Phuong':40};
var REM={from:'06:30',to:'14:00',hrs:7.5,len:'7 h 30 min',eff:'06:35–14:00',efflen:'7 h 25 min'};
var OT_TERMS='Overtime is voluntary and needs your explicit consent. It applies to work beyond your contracted weekly hours. Compensation follows company policy; the note is informational and ShiftManager does not calculate pay.';
function covHrs(it){return inProg(it)?REM.hrs:8;}
function covText(it,eff){
  if(inProg(it)) return eff?REM.eff+' ('+REM.efflen+')':REM.from+'–'+REM.to+' ('+REM.len+' remaining)';
  return SH[it.c].t+' (8 h)';}
function hoursName(n){var t=S.team.filter(function(x){return x.n===n;})[0];return t?hoursOf(t):0;}
function isOT(n,it){var c=CONTR[n];return c?(hoursName(n)+covHrs(it)>c):false;}
var OTD=['2 Nov','3 Nov','4 Nov','5 Nov','6 Nov','7 Nov','8 Nov'];
function otDay(d){return DAYS[d]+' '+OTD[d];}
function hm(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function otLen(o){var m=hm(o.to)-hm(o.from);return (m/60)+' h';}
function otIv(o){return o.from+'–'+o.to+' ('+otLen(o)+')';}
function otSu(o,n){return o.su.filter(function(x){return x.n===n;})[0]||null;}
function publishOT(){S.ot.forEach(function(o){o.published=o.su.some(function(x){return x.st==='approved';});});}
function otApprovalCard(){
  var rows='';
  S.ot.forEach(function(o){
    if(!o.su.length){rows+='<tr><td>'+otDay(o.d)+' · '+otIv(o)+'<br><span class="sm muted">'+esc(o.loc)+'</span></td><td colspan="4" class="muted">No sign-ups yet</td></tr>';return;}
    o.su.forEach(function(x,i){
      var elig=x.elig==='Eligible'?bd('ack','Eligible'):bd('can','⚠ '+esc(x.elig));
      var st=x.st==='pending'?bd('pen','Awaiting approval'):x.st==='approved'?bd('ack',S.draft&&S.draft.published?'Approved – published':'Approved'):bd('neu','Not approved');
      var act='—';
      if(x.st==='pending'&&!(S.draft&&S.draft.published)){
        act=(x.elig==='Eligible'?'<button type="button" class="btn p s" data-act="otdec" data-o="'+o.id+'" data-n="'+esc(x.n)+'" data-r="approved" data-fk="otap-'+o.id+'-'+i+'" aria-label="Approve '+esc(x.n)+' for overtime on '+otDay(o.d)+'">Approve</button>':
          '<button type="button" class="btn s" aria-disabled="true" data-act="noop" data-why="'+esc(x.n)+' is not eligible ('+esc(x.elig)+') and cannot be approved." data-fk="otap-'+o.id+'-'+i+'" aria-label="Approve '+esc(x.n)+' (unavailable: not eligible)">Approve</button>')+
          ' <button type="button" class="btn s" data-act="otdec" data-o="'+o.id+'" data-n="'+esc(x.n)+'" data-r="rejected" data-fk="otno-'+o.id+'-'+i+'" aria-label="Do not approve '+esc(x.n)+' for overtime on '+otDay(o.d)+'">Do not approve</button>';}
      rows+='<tr><td>'+(i===0?otDay(o.d)+' · '+otIv(o)+'<br><span class="sm muted">'+esc(o.loc)+'</span>':'')+'</td><td>'+esc(x.n)+'</td><td>'+elig+'</td><td>'+st+'</td><td>'+act+'</td></tr>';});});
  return '<div class="card flush scroll" role="region" aria-label="Overtime sign-ups" tabindex="0"><h2>Overtime sign-ups (check eligibility and approve before publishing)</h2><table style="margin-top:8px"><caption class="sr">Overtime sign-ups with eligibility and approval status</caption><thead><tr><th scope="col">Overtime shift</th><th scope="col">Employee</th><th scope="col">Eligibility</th><th scope="col">Status</th><th scope="col">Decision</th></tr></thead><tbody>'+rows+'</tbody></table><p class="sm muted" style="padding:6px 16px;margin:0">Employees give consent when they sign up. Only eligible, approved employees are published with the schedule.</p></div>';
}
function ackCounts(){
  var req=S.team.filter(function(t){return t.ack!=='notreq';});
  var pend=req.filter(function(t){return t.ack==='pending';}).length;
  return {req:req.length,pend:pend,done:req.length-pend,notreq:S.team.length-req.length,sup:S.sup};

SCREENS.team=function(){
  var w=S.week;
  var h='<h1>Team Schedule</h1><div class="row sb" style="margin-bottom:10px">'+weekBar(WEEKS[w],'tw')+'<span class="sm muted">Official version '+(w===1?S.ver:'–')+'</span></div>';
  if(w!==1) return h+'<div class="card"><strong>Sample data is available for the week of 26 Oct only.</strong><p class="muted" style="margin:6px 0 0">In the real system this page shows the official version of the selected week, or tells you that none is published.</p></div>';
  var ac=ackCounts();
  h+='<div class="card" style="padding:9px 14px"><div class="row sb"><span><strong>'+ac.done+' of '+ac.req+'</strong> required employees have acknowledged the latest update · <strong>'+ac.pend+' pending</strong> · '+ac.notreq+' not required · '+ac.sup+' superseded</span>'+
    '<label class="chk" style="margin:0;font-weight:500" for="pend"><input type="checkbox" id="pend" data-act="pendonly" data-fk="pend"'+(S.pendingOnly?' checked':'')+'><span>Show pending only</span></label></div></div>';
  var rows=S.team.filter(function(t){return !S.pendingOnly||t.ack==='pending';}).map(function(t){
    var codes=codesOf(t);
    return '<tr><th scope="row" style="background:none;font-size:14px;font-weight:500">'+t.n+'</th>'+codes.map(function(c){return '<td class="c">'+(c==='-'?'–':c)+'</td>';}).join('')+'<td class="c">'+hoursOf(t)+'</td><td>'+(t.ack==='pending'?bd('pen','Pending'):t.ack==='notreq'?bd('neu','Not required'):bd('ack','Acknowledged')+' <span class="sm muted">'+t.ack+'</span>')+'</td></tr>';}).join('');
  h+='<div class="card flush scroll" role="region" aria-label="Team schedule table" tabindex="0"><table><caption class="sr">Team schedule for the week of 26 October</caption><thead><tr><th scope="col">Employee</th>'+DAYS.map(function(d){return '<th scope="col" class="c">'+d+'</th>';}).join('')+'<th scope="col" class="c">Hours</th><th scope="col">Acknowledgement</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='<p class="legend">M = Morning 06–14 · A = Afternoon 14–22 · N = Night 22–06 · – = Off · Abs = absence or no-show, replacement not confirmed · Not required = the latest update does not change this employee’s assignments</p>';
  var u=uncovered();
  h+=u.length?'<div class="alert warn"><strong>Uncovered positions ('+u.length+'):</strong> '+u.map(function(x){return dayLabel(x.d)+' · '+SH[x.c].n+' · '+x.pos;}).join('; ')+'</div>':'<div class="alert ok">All positions are covered.</div>';
  return h;
};

SCREENS.coverage=function(){
  var h='<div class="row sb"><h1>Absence &amp; Shift Coverage</h1><button type="button" class="btn s" data-act="noshow" data-fk="ns-open" aria-expanded="'+S.noShowOpen+'">Record no-show</button></div>';
  if(S.noShowOpen){
    h+='<div class="card"><h2>Record a no-show</h2><form data-form="noshow" class="row" novalidate style="align-items:flex-end">'+
    '<div style="flex:1;min-width:170px"><label for="ns-emp">Employee</label><select id="ns-emp">'+S.team.map(function(t){return '<option>'+t.n+'</option>';}).join('')+'</select></div>'+
    '<div style="flex:1;min-width:130px"><label for="ns-day">Day</label><select id="ns-day">'+DAYS.map(function(d,i){return '<option value="'+i+'">'+dayLabel(i)+'</option>';}).join('')+'</select></div>'+
    '<div style="flex:1;min-width:150px"><label for="ns-sh">Shift</label><select id="ns-sh"><option value="M">Morning</option><option value="A">Afternoon</option><option value="N">Night</option></select></div>'+
    '<button type="submit" class="btn p" data-fk="ns-save">Save no-show</button></form></div>';
  }
  var list=S.items.map(function(it){var st=status(it);
    return '<button type="button" class="item" data-act="pick" data-id="'+it.id+'" data-fk="item-'+it.id+'" aria-pressed="'+(it.id===S.selItem)+'"><strong>'+it.name+'</strong><br><span class="sm">'+dayLabel(it.d)+' · '+SH[it.c].n+' · '+it.kind+'</span><br>'+bd(st[1],st[0])+(inProg(it)&&!it.resolved?' '+bd('chg','In progress'):'')+'</button>';}).join('');
  var it=current(), det='';
  if(it){
    var st=status(it);
    det+='<div class="card"><h2>Coverage for '+dayLabel(it.d)+' · '+lab(it.c)+' · '+it.pos+'</h2><p class="sm muted" style="margin:0">Absent: '+it.name+(it.reason?' · Reason: '+it.reason:'')+' · '+(it.resolved?'Coverage confirmed.':'The shortage stays visible until a valid replacement is confirmed.')+(it.expl?' · Explanation: '+esc(it.expl):'')+(inProg(it)&&!it.resolved?' This shift is in progress, so a confirmed replacement takes effect from the time of confirmation.':'')+'</p><p class="sm" style="margin:6px 0 0"><strong>'+(inProg(it)?'Remaining interval to cover':'Interval to cover')+':</strong> '+(it.resolved&&it.effText?it.effText+' (effective after confirmation)':covText(it,false))+'</p></div>';
    if(isEnded(it)&&!it.resolved){det+='<div class="alert info"><strong>This shift has already ended.</strong> A replacement can no longer be arranged. The record stays in the absence history.</div>';}else{
    var active=it.offer&&(it.offer.st==='pending'||it.offer.st==='accepted');
    var cands=S.team.filter(function(t){return t.n!==it.name&&['Nguyen Van An','Vo Thi Phuong','Do Van Hieu'].indexOf(t.n)>-1;});
    var crow=cands.map(function(t){
      var cell, mine=it.offer&&it.offer.to===t.n;
      if(it.resolved) cell=mine?bd('ack','Confirmed'):'—';
      else if(mine&&it.offer.st==='pending') cell=bd('pen','Pending')+' <button type="button" class="btn s" data-act="cancel" data-id="'+it.id+'" data-fk="cancel-'+it.id+'" aria-label="Cancel offer to '+t.n+'">Cancel offer</button>';
      else if(mine&&it.offer.st==='accepted') cell=bd('chg','Accepted');
      else if(active) cell='<button type="button" class="btn s" aria-disabled="true" data-act="noop" data-why="Only one pending offer is allowed per uncovered position. Cancel the current offer first." data-fk="send-'+t.n.split(' ').pop()+'" aria-label="Send offer to '+t.n+' (unavailable)">Send offer</button>';
      else cell=(mine&&it.offer.st==='rejected'?bd('neu','Declined')+' ':mine&&it.offer.st==='cancelled'?bd('neu','Cancelled')+' ':'')+'<button type="button" class="btn s" data-act="send" data-id="'+it.id+'" data-to="'+t.n+'" data-fk="send-'+t.n.split(' ').pop()+'" aria-label="Send offer to '+t.n+'">Send offer</button>';
      var otc=isOT(t.n,it);
      return '<tr><td>'+t.n+'</td><td class="c">'+hoursOf(t)+'</td><td class="c">OK</td><td class="c">'+(otc?(mine&&it.offer.consent?'Yes – consent recorded':'Yes – consent required'):'No')+'</td><td class="c">'+cell+'</td></tr>';}).join('');
    det+='<div class="card flush scroll" role="region" aria-label="Eligible replacement candidates" tabindex="0"><h2>Eligible replacement candidates</h2><table style="margin-top:8px"><caption class="sr">Eligible candidates for this position</caption><thead><tr><th scope="col">Employee</th><th scope="col" class="c">Hours this week</th><th scope="col" class="c">Rest time</th><th scope="col" class="c">Overtime</th><th scope="col" class="c">Offer</th></tr></thead><tbody>'+crow+'</tbody></table>'+
      '<p class="sm muted" style="padding:6px 16px;margin:0">Only one pending offer is allowed per uncovered position, so other offers are unavailable while one is pending.</p></div>';
    var ready=it.offer&&it.offer.st==='accepted'&&!it.resolved;
    det+='<div class="card"><h2>Manager decision</h2>'+(it.resolved?'<p style="margin:0">'+bd('ack','Resolved')+' The replacement was confirmed and published in version '+S.ver+'. <strong>Effective interval:</strong> '+(it.effText||covText(it,true))+'.</p>':
      '<p class="sm muted" style="margin:0 0 8px">'+(ready?'The employee accepted'+(it.offer.ot?' and gave explicit overtime consent':'')+'. Confirm to publish the replacement as a new schedule version'+(inProg(it)?'; it takes effect from the time of confirmation ('+REM.eff+').':'.'):'Available after the employee accepts an offer.')+'</p><div class="row">'+
      '<button type="button" class="btn p"'+(ready?' data-act="confirm"':' aria-disabled="true" data-act="noop" data-why="Confirmation is available after the employee accepts the offer."')+' data-id="'+it.id+'" data-fk="confirm">Confirm replacement</button>'+
      '<button type="button" class="btn"'+(ready?' data-act="decline"':' aria-disabled="true" data-act="noop" data-why="This is available after the employee accepts the offer."')+' data-id="'+it.id+'" data-fk="decline">Decline confirmation</button></div>')+'</div>';
  }}
  return h+'<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div><h2 class="sr">Reported absences and no-shows</h2>'+list+'</div><div>'+det+'</div></div>';
};

SCREENS.overview=function(){
  var u=uncovered(), unc=u.length, req=57, cov=Math.round((req-unc)/req*100);
  var ac=ackCounts();
  var unres=S.items.filter(function(i){return !i.resolved&&!isEnded(i);}).length;
  var w=S.week;
  var tiles='<div class="tiles"><div class="tile"><div class="sm muted">Coverage</div><div class="n">'+cov+'%</div><div class="sm">'+(req-unc)+' of '+req+' positions</div></div>'+
    '<div class="tile"><div class="sm muted">Uncovered positions</div><div class="n">'+unc+'</div><div class="sm">'+(unc?u.map(function(x){return DAYS[x.d]+' '+SH[x.c].n;}).join(', '):'None')+'</div></div>'+
    '<div class="tile"><div class="sm muted">Absences / no-shows</div><div class="n">'+S.items.length+'</div><div class="sm">'+unres+' unresolved</div></div>'+
    '<div class="tile"><div class="sm muted">Acknowledgement progress</div><div class="n">'+ac.done+'/'+ac.req+'</div><div class="sm">'+ac.pend+' pending · '+ac.notreq+' not required · '+ac.sup+' superseded</div></div></div>';
  var h='<div class="row sb"><h1>Staffing &amp; Workload Overview</h1>'+weekBar(WEEKS[w],'bw')+'</div><p class="sm muted" style="margin:-6px 0 12px">Production team A · single-team MVP · personal absence explanations are not shown.</p>';
  if(w!==1) return h+'<div class="card"><strong>Sample data is available for the week of 26 Oct only.</strong></div>';
  var cd=DAYS.map(function(d,i){var pos=i<5?9:6, un=u.filter(function(x){return x.d===i;}).length, p=Math.round((pos-un)/pos*100);
    return '<div class="barrow"><span class="d">'+d+'</span><span class="bar" aria-hidden="true" style="width:'+(p*2.2)+'px"></span><strong>'+p+'%</strong></div>';}).join('');
  var wl=S.team.map(function(t){var hr=hoursOf(t);return '<tr><td>'+t.n+'</td><td><span class="bar g" aria-hidden="true" style="width:'+(hr*3)+'px"></span> <strong>'+hr+' h</strong></td><td class="c">'+NIGHTS[t.n]+'</td></tr>';}).join('');
  return h+tiles+'<div class="cols"><div class="card"><h2>Coverage by day</h2>'+cd+'</div>'+
  '<div class="card flush scroll" role="region" aria-label="Workload distribution" tabindex="0"><h2>Workload distribution</h2><table style="margin-top:8px"><caption class="sr">Scheduled hours and night shifts per employee</caption><thead><tr><th scope="col">Employee</th><th scope="col">Scheduled hours</th><th scope="col" class="c">Night shifts (5 wks)</th></tr></thead><tbody>'+wl+'</tbody></table></div></div>'+
  '<div class="alert info" style="margin-top:14px"><strong>Read-only summary.</strong> Schedules are edited by the Manager only. You see authorized staffing and workload summaries for the production team.</div>';
};

SCREENS.availability=function(){
  var locked=S.avLocked, vals=locked?AVBASE:(S.avWork||S.avSaved);
  var d2=locked?['26 Oct','27 Oct','28 Oct','29 Oct','30 Oct','31 Oct','1 Nov']:['2 Nov','3 Nov','4 Nov','5 Nov','6 Nov','7 Nov','8 Nov'];
  var allU=Object.keys(vals).every(function(k){return vals[k]==='U';});
  var NM={A:'Available',U:'Unavailable',P:'Prefer Not'};
  var heads=DAYS.map(function(d,i){return '<th scope="col" class="c">'+d+' '+d2[i]+'</th>';}).join('');
  var body=['M','A','N'].map(function(c){
    return '<tr><th scope="row">'+SH[c].n+'<br><span class="sm muted" style="font-weight:400">'+SH[c].t+(c==='N'?' (ends next day)':'')+'</span></th>'+DAYS.map(function(d,i){
      var k=i+c, v=vals[k];
      if(locked) return '<td class="c">'+NM[v]+'</td>';
      return '<td class="g"><select data-av="'+k+'" data-fk="av-'+k+'" aria-label="'+d+' '+d2[i]+', '+SH[c].n+'">'+['A','U','P'].map(function(o){return '<option value="'+o+'"'+(v===o?' selected':'')+'>'+NM[o]+'</option>';}).join('')+'</select></td>';}).join('')+'</tr>';}).join('');
  return '<h1>Availability and Overtime Sign-up</h1><p class="sm muted" style="margin:-4px 0 12px">Availability and overtime consent are separate: saving availability never signs you up for overtime, and signing up never changes your availability.</p>'+
  '<div class="card"><div class="row sb"><div style="min-width:240px"><label for="avweek">Week</label><select id="avweek" data-chg="avweek"><option value="open"'+(locked?'':' selected')+'>2 Nov – 8 Nov 2026 (open)</option><option value="locked"'+(locked?' selected':'')+'>26 Oct – 1 Nov 2026 (locked)</option></select></div>'+
  '<div class="sm" style="flex:1;min-width:240px">'+(locked?'<strong>Locked since Thu 22 Oct 2026, 18:00.</strong> This week is read-only.':'<strong>Submission closes Thu 29 Oct 2026, 18:00</strong> (Asia/Ho_Chi_Minh, UTC+7). It is now Thu 29 Oct, 06:30.')+'</div></div></div>'+
  (allU&&!locked?'<div class="alert warn" role="alert"><strong>Warning:</strong> every shift is marked Unavailable. You can still save, but the Manager will not be able to schedule you this week.</div>':'')+
  '<form data-form="availability" novalidate><div class="card flush scroll" role="region" aria-label="Availability grid" tabindex="0"><table><caption class="sr">Availability for each shift and day</caption><thead><tr><th scope="col">Shift</th>'+heads+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
  (locked?'':'<div class="row"><button type="submit" class="btn p" data-fk="av-save">Save availability</button><button type="button" class="btn" data-act="avreset" data-fk="av-reset">Reset to baseline</button></div>')+
  '</form><p class="legend"><strong>Available</strong> = may be scheduled · <strong>Prefer Not</strong> = the scheduler avoids it when possible · <strong>Unavailable</strong> = never scheduled. Your baseline is your standing weekly pattern; Reset restores it, and Save stores it for this week.</p>'+otList();
};

function otList(){
  var rows=S.ot.map(function(o){
    var su=otSu(o,'Nguyen Van An'), st, act='';
    if(o.closed){st=bd('neu','Closed');}
    else if(!su){st=bd('neu','Not signed up');act='<button type="button" class="btn p s" data-act="otopen" data-o="'+o.id+'" data-fk="ot-su-'+o.id+'" aria-label="Sign up for overtime on '+otDay(o.d)+'">Sign up</button>';}
    else if(su.st==='pending'){st=bd('pen','Signed up – awaiting approval');act='<button type="button" class="btn s" data-act="otwd" data-o="'+o.id+'" data-fk="ot-wd-'+o.id+'" aria-label="Withdraw from overtime on '+otDay(o.d)+'">Withdraw</button>';}
    else if(su.st==='approved'){st=bd('ack',o.published?'Approved – published':'Approved');act='<span class="sm muted">Contact your Manager to change an approved shift.</span>';}
    else{st=bd('neu','Not approved');}
    var panel='';
    if(S.otConsent===o.id&&!su&&!o.closed) panel='<tr><td colspan="5" style="background:var(--surface2)"><form data-form="otsignup" data-o="'+o.id+'" novalidate><p class="sm" style="margin:0 0 6px"><strong>Overtime terms:</strong> '+OT_TERMS+'</p><label class="chk" for="otcons"><input type="checkbox" id="otcons" aria-describedby="otcons-err"><span>I consent to work this overtime shift under the terms above.</span></label><div id="otcons-err" class="err-t"'+(S.otErr?'':' hidden')+'>'+S.otErr+'</div><div class="row" style="margin-top:8px"><button type="submit" class="btn p s" data-fk="ot-confirm">Confirm sign-up</button><button type="button" class="btn s" data-act="otclose" data-fk="ot-cancel">Cancel</button></div></form></td></tr>';
    return '<tr><td><strong>'+otDay(o.d)+'</strong><br>'+otIv(o)+'</td><td>'+esc(o.loc)+'</td><td>'+esc(o.duties)+'<br><span class="sm muted">'+esc(o.note)+'</span></td><td>'+st+'</td><td>'+act+'</td></tr>'+panel;}).join('');
  return '<h2 style="margin:18px 0 8px">Overtime shifts</h2><div class="card flush scroll" role="region" aria-label="Overtime shifts" tabindex="0"><table><caption class="sr">Posted overtime shifts with terms and your sign-up status</caption><thead><tr><th scope="col">Shift and interval</th><th scope="col">Location</th><th scope="col">Duties and compensation note</th><th scope="col">Your status</th><th scope="col">Action</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="legend">Signing up records your consent only. The Manager checks eligibility and approves before the schedule is published.</p>';
}

SCREENS.accounts=function(){
  var er=S.accErr||{}, h='<div class="row sb"><h1>Employee Accounts</h1>'+(S.accMode==='list'?'<button type="button" class="btn p s" data-act="accnew" data-fk="acc-new">Create employee account</button>':'')+'</div>';
  if(S.accConfirm){var c=S.accConfirm;
    h+='<div class="alert warn" role="alertdialog" aria-labelledby="ac-t"><p id="ac-t" style="margin:0 0 8px"><strong>'+(c.to==='inactive'?'Deactivate':'Activate')+' the account of '+esc(c.n)+'?</strong> '+(c.to==='inactive'?'They will no longer be able to log in. Published assignments are not changed automatically; check coverage afterwards.':'They will be able to log in again.')+'</p><div class="row"><button type="button" class="btn p" data-act="accyes" data-fk="ac-yes">Confirm</button><button type="button" class="btn" data-act="accno" data-fk="ac-no">Cancel</button></div></div>';}
  if(S.accMode!=='list'){
    var ed=S.accMode==='edit', cur=ed?S.acc.filter(function(a){return a.email===S.accEdit;})[0]:{n:'',email:'',pos:''}, v=S.accVals||cur;
    h+='<div class="card"><h2>'+(ed?'Edit employee':'New employee')+'</h2><form data-form="account" novalidate>'+
    '<div class="fld"><label for="an-name">Full name</label><input id="an-name" type="text" value="'+esc(v.n)+'" aria-describedby="an-name-err"'+(er.n?' aria-invalid="true"':'')+'><div id="an-name-err" class="err-t"'+(er.n?'':' hidden')+'>'+(er.n||'')+'</div></div>'+
    (ed?'<div class="fld"><span class="lbl">Work email</span><div>'+esc(cur.email)+' <span class="sm muted">(cannot be changed here)</span></div></div>':
    '<div class="fld"><label for="an-email">Work email</label><input id="an-email" type="email" value="'+esc(v.email)+'" aria-describedby="an-email-err"'+(er.email?' aria-invalid="true"':'')+'><div id="an-email-err" class="err-t"'+(er.email?'':' hidden')+'>'+(er.email||'')+'</div></div>')+
    '<div class="fld"><label for="an-pos">Position</label><select id="an-pos" aria-describedby="an-pos-err"'+(er.pos?' aria-invalid="true"':'')+'><option value="">Select a position</option>'+POSLIST.map(function(p){return '<option'+(v.pos===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select><div id="an-pos-err" class="err-t"'+(er.pos?'':' hidden')+'>'+(er.pos||'')+'</div></div>'+
    '<div class="fld"><span class="lbl">Role</span><div>Employee <span class="sm muted">(fixed)</span></div></div>'+
    '<div class="row"><button type="submit" class="btn p" data-fk="acc-save">'+(ed?'Save changes':'Create account')+'</button><button type="button" class="btn" data-act="acccancel" data-fk="acc-cancel">Cancel</button></div>'+
    (ed?'':'<p class="sm muted" style="margin:10px 0 0">The new account is created as Active. The employee sets a password through the authentication service.</p>')+'</form></div>';
  }
  var rows=S.acc.map(function(a,i){
    return '<tr><th scope="row" style="background:none;font-size:14px;font-weight:500">'+esc(a.n)+'</th><td>'+esc(a.email)+'</td><td>'+a.pos+'</td><td>'+(a.active?bd('ack','Active'):bd('neu','Inactive'))+'</td><td><button type="button" class="btn s" data-act="accedit" data-e="'+esc(a.email)+'" data-fk="acc-ed-'+i+'" aria-label="Edit '+esc(a.n)+'">Edit</button> '+
      (a.active?'<button type="button" class="btn s" data-act="accask" data-e="'+esc(a.email)+'" data-to="inactive" data-fk="acc-tg-'+i+'" aria-label="Deactivate '+esc(a.n)+'">Deactivate</button>':'<button type="button" class="btn s" data-act="accask" data-e="'+esc(a.email)+'" data-to="active" data-fk="acc-tg-'+i+'" aria-label="Activate '+esc(a.n)+'">Activate</button>')+'</td></tr>';}).join('');
  return h+'<div class="card flush scroll" role="region" aria-label="Team accounts" tabindex="0"><table><caption class="sr">Employee accounts of your production team</caption><thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Position</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="legend">'+S.acc.filter(function(a){return a.active;}).length+' active · '+S.acc.filter(function(a){return !a.active;}).length+' inactive. Inactive accounts cannot log in. Accounts are managed by the Manager only; Manager and Boss accounts are not listed.</p>';

SCREENS.staffing=function(){
  var tgt=S.stTarget, saved=tgt==='default'?S.staffDef:S.staffWeek, w=S.stWork||saved, er=S.stErr||{keys:{},msgs:[]};
  var heads=DAYS.map(function(d){return '<th scope="col" class="c">'+d+'</th>';}).join('');
  var body='',tot='';
  ['M','A','N'].forEach(function(c){
    POS.forEach(function(p,pi){
      body+='<tr><th scope="row">'+SH[c].n+' · '+p+'</th>'+DAYS.map(function(d,i){var k=c+'|'+pi+'|'+i;

function applyReplacement(it){
  var cand=it.offer.to, anAff=(cand==='Nguyen Van An'||it.name==='Nguyen Van An');
  S.ver+=1; S.pub='28 Oct 2026, 16:25';
  if(anAff){
    if(S.anAck==='pending'){S.sup+=1;S.anNote='Your earlier unacknowledged update was superseded by version '+S.ver+'. The summary below now includes all changes since your last acknowledged schedule.';}
    else{S.an=S.an.map(function(r){return r.ch==='can'?row('-'):row(r.c,null,'',r.pos);});S.anNote='';}
    if(cand==='Nguyen Van An'){S.an[it.d]=row(it.c,'new','Not assigned',it.pos);if(inProg(it))S.an[it.d].eff=REM.eff;}
    if(it.name==='Nguyen Van An'){S.an[it.d]=row(it.c,'can',lab(it.c),it.pos);}
    S.anAck='pending';S.anAckAt='';
    S.team.forEach(function(t){if(t.n==='Nguyen Van An')t.ack='pending';});
  }
  S.team.forEach(function(t){if((t.n===cand||t.n===it.name)&&t.n!=='Nguyen Van An')t.ack='pending';});
  it.effText=covText(it,true);
  it.resolved=true;
}

  }
  if(name==='availability'){
    var w2=S.avWork||S.avSaved, allU2=Object.keys(w2).every(function(k){return w2[k]==='U';});
    S.avSaved=copyObj(w2);S.avWork=null;
    if(allU2) flash('warn','Saved. Every shift is marked Unavailable, so the Manager cannot schedule you for 2–8 Nov.');
    else flash('ok','Availability for 2–8 Nov saved. You can change it until Thu 29 Oct 2026, 18:00.');
    render();return;
  }
  if(name==='staffing'){
    var saved=S.stTarget==='default'?S.staffDef:S.staffWeek, w3=S.stWork||saved, msgs=[], keys={};
    ['M','A','N'].forEach(function(c){for(var d=0;d<7;d++){var sum=0;
      for(var p=0;p<2;p++){var k=c+'|'+p+'|'+d, v=w3[k];
        if(typeof v!=='number'||isNaN(v)||v<0||v!==Math.floor(v)){keys[k]=1;msgs.push(SH[c].n+', '+POS[p]+', '+DAYS[d]+': enter a whole number of 0 or more.');v=0;}
        sum+=v;}
      if(sum>50){keys[c+'|0|'+d]=1;keys[c+'|1|'+d]=1;msgs.push(SH[c].n+', '+DAYS[d]+': the total is '+sum+'; it must be between 0 and 50.');}}});
    if(msgs.length){S.stErr={keys:keys,msgs:msgs};S.stStale=false;S.flash=null;render();var fi=app.querySelector('[aria-invalid="true"]');if(fi)fi.focus();announce('Not saved. '+msgs.length+' problems.');return;}
    S.stErr=null;
    if(S.simStale){S.stStale=true;S.flash=null;render();var ll=app.querySelector('[data-fk="load-latest"]');if(ll)ll.focus();announce('Not saved. Another change was saved first.');return;}
    if(S.stTarget==='default')S.staffDef=copyObj(w3);else S.staffWeek=copyObj(w3);
    S.stWork=null;S.stStale=false;
    flash('ok','Staffing requirements saved'+(S.stTarget==='default'?' as the default template.':' for the week of 2 Nov.')+' Drafts generated from now on use them; published schedules are unchanged.');render();return;
  }
  if(name==='assign'){S.draft.unc=0;flash('ok','Position filled. The draft now has no uncovered positions.');render();return;}
  if(name==='noshow'){
    var emp=document.getElementById('ns-emp').value,dd=+document.getElementById('ns-day').value,cc=document.getElementById('ns-sh').value;
    var item={id:S.nextId++,name:emp,d:dd,c:cc,pos:'Machine Operator',kind:'No-show recorded '+nowStr(),reason:'',resolved:false,offer:null};
    S.items.push(item);S.selItem=item.id;S.noShowOpen=false;flash('ok','No-show recorded for '+emp+'. Choose a replacement below.');render();return;
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.tagName==='INPUT'){act(b.dataset.act,b.dataset,b);return;}
  if(b.getAttribute('aria-disabled')==='true'&&b.dataset.act!=='noop')return;
  act(b.dataset.act,b.dataset,b);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.sk!==undefined){
    var base=S.stTarget==='default'?S.staffDef:S.staffWeek;
    if(!S.stWork)S.stWork=copyObj(base);
    S.stWork[t.dataset.sk]=(t.value===''?NaN:Number(t.value));
    var pr=t.dataset.sk.split('|'), a=S.stWork[pr[0]+'|0|'+pr[2]], b=S.stWork[pr[0]+'|1|'+pr[2]];
    var cell=app.querySelector('[data-tot="'+pr[0]+'|'+pr[2]+'"]');if(cell)cell.innerHTML='<strong>'+((isNaN(a)||isNaN(b))?'?':a+b)+'</strong>';
  }
  if(t.id==='expl'){var cn=document.getElementById('expl-cnt');if(cn)cn.textContent=t.value.length+' / 500';}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.chg==='avweek'){S.avLocked=(t.value==='locked');S.avWork=null;S.flash=null;render();announce(S.avLocked?'Showing the locked week, read-only.':'Showing the open week.');return;}
  if(t.dataset.chg==='sttgt'){S.stTarget=t.value;S.stWork=null;S.stErr=null;S.stStale=false;S.flash=null;render();announce('Editing '+(t.value==='default'?'the default template.':'the target week 2 to 8 November.'));return;}
  if(t.dataset.av!==undefined){
    var before=Object.keys(S.avWork||S.avSaved).every(function(k){return (S.avWork||S.avSaved)[k]==='U';});
    if(!S.avWork)S.avWork=copyObj(S.avSaved);
    S.avWork[t.dataset.av]=t.value;
    var after=Object.keys(S.avWork).every(function(k){return S.avWork[k]==='U';});
    if(before!==after){render();var again=app.querySelector('[data-fk="av-'+t.dataset.av+'"]');if(again)again.focus();}
  }
});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();form(f.dataset.form,f);});
document.getElementById('skip').addEventListener('click',function(e){e.preventDefault();var m=document.getElementById('main'),h=m&&m.querySelector('h1');(h||m).setAttribute('tabindex','-1');(h||m).focus();});
render(false);
})();
</script>

</body></html>
